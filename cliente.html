// Aplicar el estilo predeterminado de bienvenida

  }

  
await Promise.all([1, 2].map(async (numero) => {

  const x = event['welcome_photo_' + numero + '_x'] ?? 50;

}));

async function prepareClientAccess() {
  if (!eventSlug) {
    clientLoginStatus.textContent = 'El enlace del evento no es válido.';
    clientLoginBtn.disabled = true;
    return;
  }

  const { data, error } = await db
    .from('events')
    .select('id')
    .eq('slug', eventSlug)
    .single();

  if (error || !data) {
    clientLoginStatus.textContent = 'No se encontró el evento.';
    clientLoginBtn.disabled = true;
    return;
  }

  eventId = data.id;

const savedToken = sessionStorage.getItem('clientToken');
const savedEventId = sessionStorage.getItem('clientEventId');

if (savedToken && savedEventId === eventId) {
  try {
    const payload = JSON.parse(
      atob(savedToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))
    );

    if (
      payload.exp * 1000 > Date.now() &&
      payload.eventId === eventId &&
      payload.role === 'client' &&
      payload.purpose === 'media-management'
    ) {
      clientLogin.style.display = 'none';
document.querySelector('header').style.display = 'none';
document.querySelector('main').style.display = 'none';

await loadClientWelcome();
document.getElementById('clientWelcome').style.display = 'block';
      
      return;
    }
  } catch (error) {
    console.warn('Sesión guardada no válida:', error);
  }
}

sessionStorage.removeItem('clientToken');
sessionStorage.removeItem('clientEventId');

  
}

clientLoginForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!eventId) return;

  const password = document.getElementById('clientPassword').value;
  clientLoginBtn.disabled = true;
  clientLoginStatus.textContent = 'Verificando acceso...';

  try {
    const response = await fetch('/api/cliente-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ eventId, password })
    });


    const result = await response.json();

    if (!response.ok || !result.success || !result.token) {
      throw new Error(result.error || 'No se pudo iniciar sesión.');
    }

    sessionStorage.setItem('clientToken', result.token);
    sessionStorage.setItem('clientEventId', eventId);

    document.getElementById('clientPassword').value = '';

    
    clientLogin.style.display = 'none';
document.querySelector('header').style.display = 'none';
document.querySelector('main').style.display = 'none';

await loadClientWelcome();
document.getElementById('clientWelcome').style.display = 'block';

  } catch (error) {
    clientLoginStatus.textContent = error.message;
  } finally {
    clientLoginBtn.disabled = false;
  }
});
