<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi galería</title>

<style>

  *{

    box-sizing:border-box;

  }

  body{

    margin:0;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    background:#fff;

    color:#111;

  }

header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:18px 16px 12px;

}

header h1{

  margin:0;

  font-size:28px;

  font-weight:700;

}

#selectBtn{

  border:0;

  background:none;

  font-size:16px;

  cursor:pointer;

}

.gallery{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:2px;

  padding:2px;

}

.media-item{

  position:relative;

  aspect-ratio:1/1;

  overflow:hidden;

  background:#eee;

}

.media-item img,

.media-item video{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}
.viewer{

  display:none;

  position:fixed;

  inset:0;

  background:#000;

  z-index:1000;

}
  
</style>

  
</head>

<body>

  <header>

  <h1>Mi galería</h1>

  <button id="selectBtn">Seleccionar</button>

</header>
  <main>

  <div id="gallery" class="gallery"></div>

</main>

<div id="viewer" class="viewer">

</div>



  
</body>

</html>
