<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi galería</title>

<style>

  *{

    box-sizing:border-box;

  }

  body{

    margin:0;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    background:#fff;

    color:#111;

  }

header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:18px 16px 12px;

}

header h1{

  margin:0;

  font-size:28px;

  font-weight:700;

}

#selectBtn{

  border:0;

  background:none;

  font-size:16px;

  cursor:pointer;

}

.gallery{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:2px;

  padding:2px;

}

.media-item{

  position:relative;

  aspect-ratio:1/1;

  overflow:hidden;

  background:#eee;

}

.media-item img,

.media-item video{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}
.viewer{

  display:none;

  position:fixed;

  inset:0;

  background:#000;

  z-index:1000;

}
  
</style>

  
</head>

<body>

  <header>

  <h1>Mi galería</h1>

  <button id="selectBtn">Seleccionar</button>

</header>
  <main>

  <div id="gallery" class="gallery"></div>

</main>

<div id="viewer" class="viewer">

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

 <script>
const SUPABASE_URL='https://qzsukbfxqdyhpbzlzlwd.supabase.co';
const SUPABASE_KEY='sb_publishable_CLf1AiL7oKwqFQsG7oYGSg_F8qNl-nk';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); 

const eventId='f2e8adf2-c30c-4c47-a279-5cfbf5116194';

   async function loadClientGallery(){

  const {data,error}=await db

    .from('media')

    .select('*')

    .eq('event_id',eventId)

    .order('created_at',{ascending:false});

  if(error){

    console.error(error);

    return;

  }
  console.log('Archivos del evento:',data);

   const keys=data.map(item=>item.thumbnail_path || item.file_path);

const response=await fetch('/api/r2-upload',{

  method:'POST',

  headers:{'Content-Type':'application/json'},

  body:JSON.stringify({keys})

});

if(!response.ok){

  console.error('Error al obtener las imágenes');

  return;

}

const urlData=await response.json();

const signedUrls=urlData.urls;
const gallery=document.getElementById('gallery');

gallery.innerHTML='';

for(const item of data){
  

  if(item.media_type==='photo'){

    const div=document.createElement('div');

    div.className='media-item';

    const img=document.createElement('img');

    const imageKey=item.thumbnail_path || item.file_path;

    img.src=signedUrls[imageKey];

    img.alt='Foto del evento';

    img.loading='lazy';
    
    div.addEventListener('click',()=>{

  openViewer(item);

});
    
    
    div.appendChild(img);

    gallery.appendChild(div);

  }

if(item.media_type==='video'){

  const div=document.createElement('div');

  div.className='media-item';

  const video=document.createElement('video');

  video.src=signedUrls[item.file_path];

  video.preload='metadata';

  video.muted=true;

  video.playsInline=true;

  video.addEventListener('loadedmetadata',()=>{

    if(video.duration>0){

      video.currentTime=Math.min(0.1,video.duration/2);

    }

  },{once:true});

  div.appendChild(video);

const playIcon=document.createElement('span');
playIcon.textContent='▶';
playIcon.style.position='absolute';
playIcon.style.left='50%';
playIcon.style.top='50%';
playIcon.style.transform='translate(-50%,-50%)';
playIcon.style.color='white';
playIcon.style.fontSize='28px';
playIcon.style.textShadow='0 1px 5px rgba(0,0,0,.8)';
playIcon.style.pointerEvents='none';
div.appendChild(playIcon);

  
  gallery.appendChild(div);

}
  
}     

}


   async function openViewer(item){

  const viewer=document.getElementById('viewer');

  viewer.innerHTML='';

  const response=await fetch('/api/r2-upload',{

    method:'POST',

    headers:{'Content-Type':'application/json'},

    body:JSON.stringify({key:item.file_path})

  });

  if(!response.ok) return;

  const urlData=await response.json();

  const img=document.createElement('img');

  img.src=urlData.viewUrl;

  img.style.width='100%';

  img.style.height='100%';

  img.style.objectFit='contain';

  viewer.appendChild(img);


const closeBtn=document.createElement('button');

closeBtn.textContent='×';

closeBtn.style.position='absolute';

closeBtn.style.top='18px';

closeBtn.style.right='18px';

closeBtn.style.zIndex='1001';

closeBtn.style.background='rgba(0,0,0,.45)';

closeBtn.style.color='white';

closeBtn.style.border='0';

closeBtn.style.borderRadius='50%';

closeBtn.style.width='44px';

closeBtn.style.height='44px';

closeBtn.style.fontSize='32px';

closeBtn.style.cursor='pointer';

closeBtn.addEventListener('click',()=>{

  viewer.style.display='none';

  viewer.innerHTML='';

});

viewer.appendChild(closeBtn);

     
  viewer.style.display='block';

}
   
   loadClientGallery();
   



   
</script> 

  
</body>

</html>
