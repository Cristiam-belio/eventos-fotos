<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mi galería</title>

<style>

  *{

    box-sizing:border-box;

  }

  body{

    margin:0;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

    background:#fff;

    color:#111;

  }

header{
  position: sticky;

top: 0;

z-index: 100;
  margin-bottom: -74px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:18px 16px 12px;

}

header h1{

  margin:0;

  font-size:32px;

  font-weight:800;
  color: white;

}

#eventName{

    margin-top:2px;

    font-size:18px;

    font-weight:700;

    color:white;

}


  
#selectBtn{

  border:0;

 background:#1c1c1e;
  border-radius:999px;
  padding:10px 18px;
  color:white;

  font-size:16px;

  cursor:pointer;

}

#downloadBtn{

    border:0;

    background:#1c1c1e;

    border-radius:999px;

    padding:10px 18px;

    color:white;

    font-size:16px;

    cursor:pointer;

}

#deleteBtn{

  position:fixed;

  right:20px;

  bottom:30px;

  z-index:200;

width:76px;
height:76px;

  border:0;

  border-radius:50%;

  background:#1c1c1e;

  color:white;

  font-size:30px;

  align-items:center;

  justify-content:center;

  cursor:pointer;

}


  
  
.gallery{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:2px;

  padding:2px;

}

.media-item{

  position:relative;

  aspect-ratio:1/1;

  overflow:hidden;

  background:#eee;

}

.media-item img,

.media-item video{

  width:100%;

  height:100%;

  object-fit:cover;

  display:block;

}
.viewer{

  display:none;

  position:fixed;

  inset:0;

  background:#000;

  z-index:1000;

}
  
</style>

  
</head>

<body>

  <header>

<div class="gallery-title">

    <h1>Mi galería</h1>

    <div id="eventName"></div>

</div>

<button id="selectBtn">Seleccionar</button>
<button id="downloadBtn" style="display:none;">Descargar</button>

<button id="deleteBtn" style="display:none;" aria-label="Eliminar archivos seleccionados"><svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="#b8b8bd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14h28"/><path d="M18 14V9h12v5"/><path d="M14 14l2 27h16l2-27"/><path d="M21 21v13"/><path d="M27 21v13"/></svg></button>

</header>
  <main>

  <div id="gallery" class="gallery"></div>

</main>

<div id="viewer" class="viewer">

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  

 <script>
const SUPABASE_URL='https://qzsukbfxqdyhpbzlzlwd.supabase.co';
const SUPABASE_KEY='sb_publishable_CLf1AiL7oKwqFQsG7oYGSg_F8qNl-nk';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); 

const eventId='f2e8adf2-c30c-4c47-a279-5cfbf5116194';
const eventName=document.getElementById('eventName');
   async function loadEventName(){

  const {data,error}=await db

    .from('events')

    .select('celebrant_names')

    .eq('id',eventId)

    .single();

  if(error || !data) return;

  eventName.textContent=data.celebrant_names || '';

}

   
let clientMedia=[];
let currentIndex=-1;
let selectionMode=false;

const selectedMedia=new Set();

   const selectBtn=document.getElementById('selectBtn');
   const downloadBtn=document.getElementById('downloadBtn');
   const deleteBtn=document.getElementById('deleteBtn');

   

selectBtn.addEventListener('click',()=>{

  selectionMode=!selectionMode;

  selectedMedia.clear();
loadClientGallery();
  selectBtn.textContent=selectionMode ? 'Cancelar' : 'Seleccionar';
downloadBtn.style.display=selectionMode ? 'inline-block' : 'none';
deleteBtn.style.display=selectionMode ? 'flex' : 'none';
  

});

deleteBtn.addEventListener('click',async()=>{

  

  if(selectedMedia.size===0){

    alert('Selecciona al menos una foto o video');

    return;

  }

  const confirmed=confirm(`¿Eliminar ${selectedMedia.size} archivo(s)?\n\nEsta acción no se puede deshacer.`);

  if(!confirmed){

    return;

  }

  const filesToDelete=clientMedia.filter(item=>selectedMedia.has(item.id));

    try {

    for(const item of filesToDelete){

    const response=await fetch('/api/r2-delete',{

      method:'POST',

      headers:{'Content-Type':'application/json'},

      body:JSON.stringify({key:item.file_path})

    });

    if(!response.ok){

      throw new Error('No se pudo eliminar el archivo de R2');

    }

    if(item.thumbnail_path && item.thumbnail_path!==item.file_path){

      const thumbResponse=await fetch('/api/r2-delete',{

        method:'POST',

        headers:{'Content-Type':'application/json'},

        body:JSON.stringify({key:item.thumbnail_path})

      });

      if(!thumbResponse.ok){

        throw new Error('No se pudo eliminar la miniatura de R2');

      }

    }


      
  }

  const { error: deleteError }=await db

    .from('media')

    .delete()

    .in('id',[...selectedMedia]);

  if(deleteError){

    throw new Error('No se pudo eliminar el registro de Supabase');

  }

    selectedMedia.clear();

  selectionMode=false;

  selectBtn.textContent='Seleccionar';

  downloadBtn.style.display='none';

  deleteBtn.style.display='none';

  await loadClientGallery();

  } catch(error) {

    console.error('Error al eliminar:', error);

    alert('No se pudieron eliminar los archivos. Inténtalo nuevamente.');

  }

      
});

   
downloadBtn.addEventListener('click',async()=>{

  if(selectedMedia.size===0){

    alert('Selecciona al menos una foto o video');

    return;

  }

const filesToDownload=clientMedia.filter(item=>selectedMedia.has(item.id));
if(filesToDownload.length>1){

  const zip=new JSZip();
for(const item of filesToDownload){

  const response=await fetch('/api/r2-upload',{

    method:'POST',

    headers:{'Content-Type':'application/json'},

    body:JSON.stringify({key:item.file_path})

  });

  if(!response.ok) continue;

  const urlData=await response.json();

  const fileResponse=await fetch(urlData.viewUrl);

  const blob=await fileResponse.blob();

  zip.file(item.file_name || `archivo-${item.id}`,blob);

}
  

  const zipBlob=await zip.generateAsync({type:'blob'});

const downloadUrl=URL.createObjectURL(zipBlob);

const link=document.createElement('a');

link.href=downloadUrl;

link.download='galeria-seleccionada.zip';

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(()=>URL.revokeObjectURL(downloadUrl),1000);
  

  selectionMode=false;

selectedMedia.clear();

selectBtn.textContent='Seleccionar';

downloadBtn.style.display='none';
deleteBtn.style.display='none';  


  
  
  loadClientGallery();

return;

}

  
  for(const item of filesToDownload){

  const response=await fetch('/api/r2-upload',{

    method:'POST',

    headers:{'Content-Type':'application/json'},

    body:JSON.stringify({key:item.file_path})

  });

  if(!response.ok) continue;

  const urlData=await response.json();

  const fileResponse=await fetch(urlData.viewUrl);

const blob=await fileResponse.blob();

const downloadUrl=URL.createObjectURL(blob);

const link=document.createElement('a');

link.href=downloadUrl;

link.download=item.file_name || 'archivo';

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(()=>URL.revokeObjectURL(downloadUrl),1000);
  

selectionMode=false;

selectedMedia.clear();

selectBtn.textContent='Seleccionar';

downloadBtn.style.display='none';

loadClientGallery();
    

}
  
});

   
   
   
   async function loadClientGallery(){

  const {data,error}=await db

    .from('media')

    .select('*')

    .eq('event_id',eventId)

    .order('created_at',{ascending:false});

  if(error){

    console.error(error);

    return;

  }

clientMedia=data;
     
  console.log('Archivos del evento:',data);

   const keys=data.map(item=>item.thumbnail_path || item.file_path);

const response=await fetch('/api/r2-upload',{

  method:'POST',

  headers:{'Content-Type':'application/json'},

  body:JSON.stringify({keys})

});

if(!response.ok){

  console.error('Error al obtener las imágenes');

  return;

}

const urlData=await response.json();

const signedUrls=urlData.urls;
const gallery=document.getElementById('gallery');

gallery.innerHTML='';

for(const item of data){
  

  if(item.media_type==='photo'){

    const div=document.createElement('div');

    div.className='media-item';

    const img=document.createElement('img');

    const imageKey=item.thumbnail_path || item.file_path;

    img.src=signedUrls[imageKey];

    img.alt='Foto del evento';

    img.loading='lazy';
    
    div.addEventListener('click',()=>{

  if(selectionMode){

    if(selectedMedia.has(item.id)){

      selectedMedia.delete(item.id);

      div.style.opacity='1';

      const check=div.querySelector('.selection-check');

if(check) check.remove();

    }else{

      selectedMedia.add(item.id);

      div.style.opacity='0.5';
const check=document.createElement('span');

check.textContent='✓';

check.className='selection-check';

check.style.position='absolute';

check.style.top='6px';

check.style.right='6px';

check.style.background='#007AFF';

check.style.color='white';

check.style.width='26px';

check.style.height='26px';

check.style.borderRadius='50%';

check.style.display='flex';

check.style.alignItems='center';

check.style.justifyContent='center';

check.style.fontWeight='bold';

check.style.zIndex='10';

div.appendChild(check);

      

    }

    return;

  }

  openViewer(item);

});
    
    
    div.appendChild(img);

    gallery.appendChild(div);

  }

if(item.media_type==='video'){

  const div=document.createElement('div');

  div.className='media-item';

  const video=document.createElement('video');

  video.src=signedUrls[item.file_path];

  video.preload='metadata';

  video.muted=true;

  video.playsInline=true;

  video.addEventListener('loadedmetadata',()=>{

    if(video.duration>0){

      video.currentTime=Math.min(0.1,video.duration/2);

    }

  },{once:true});

  div.appendChild(video);

div.addEventListener('click',()=>{

  if(selectionMode){

    if(selectedMedia.has(item.id)){

      selectedMedia.delete(item.id);

      div.style.opacity='1';
const check=div.querySelector('.selection-check');

if(check) check.remove();

    }else{

      selectedMedia.add(item.id);

      div.style.opacity='0.5';

const check=document.createElement('span');

check.textContent='✓';

check.className='selection-check';

check.style.position='absolute';

check.style.top='6px';

check.style.right='6px';

check.style.background='#007AFF';

check.style.color='white';

check.style.width='26px';

check.style.height='26px';

check.style.borderRadius='50%';

check.style.display='flex';

check.style.alignItems='center';

check.style.justifyContent='center';

check.style.fontWeight='bold';

check.style.zIndex='10';

div.appendChild(check);

      

    }

    return;

  }

  openViewer(item);

});
  
const playIcon=document.createElement('span');
playIcon.textContent='▶';
playIcon.style.position='absolute';
playIcon.style.left='50%';
playIcon.style.top='50%';
playIcon.style.transform='translate(-50%,-50%)';
playIcon.style.color='white';
playIcon.style.fontSize='28px';
playIcon.style.textShadow='0 1px 5px rgba(0,0,0,.8)';
playIcon.style.pointerEvents='none';
div.appendChild(playIcon);

  
  gallery.appendChild(div);

}
  
}     

}


   async function openViewer(item){
     currentIndex=clientMedia.findIndex(media=>media.id===item.id);
     

  const viewer=document.getElementById('viewer');

  viewer.innerHTML='';

  const response=await fetch('/api/r2-upload',{

    method:'POST',

    headers:{'Content-Type':'application/json'},

    body:JSON.stringify({key:item.file_path})

  });

  if(!response.ok) return;

  const urlData=await response.json();

  let media;

if(item.media_type==='video'){

  media=document.createElement('video');

  media.src=urlData.viewUrl;

  media.controls=true;

  media.autoplay=true;

  media.playsInline=true;

}else{

  media=document.createElement('img');

  media.src=urlData.viewUrl;

}

media.style.width='100%';

media.style.height='100%';

media.style.objectFit='contain';

viewer.appendChild(media);


const closeBtn=document.createElement('button');

closeBtn.textContent='×';

closeBtn.style.position='absolute';

closeBtn.style.top='18px';

closeBtn.style.right='18px';

closeBtn.style.zIndex='1001';

closeBtn.style.background='rgba(0,0,0,.45)';

closeBtn.style.color='white';

closeBtn.style.border='0';

closeBtn.style.borderRadius='50%';

closeBtn.style.width='44px';

closeBtn.style.height='44px';

closeBtn.style.fontSize='32px';

closeBtn.style.cursor='pointer';

closeBtn.addEventListener('click',()=>{

  viewer.style.display='none';

  viewer.innerHTML='';

});

viewer.appendChild(closeBtn);
    
const nextBtn=document.createElement('button');

nextBtn.textContent='›';

nextBtn.style.position='absolute';

nextBtn.style.right='12px';

nextBtn.style.top='50%';

nextBtn.style.transform='translateY(-50%)';

nextBtn.style.zIndex='1001';

nextBtn.style.background='rgba(0,0,0,.35)';

nextBtn.style.color='white';

nextBtn.style.border='0';

nextBtn.style.borderRadius='50%';

nextBtn.style.width='48px';

nextBtn.style.height='48px';

nextBtn.style.fontSize='38px';

nextBtn.style.cursor='pointer';

nextBtn.addEventListener('click',showNext);

viewer.appendChild(nextBtn);



     const previousBtn=document.createElement('button');

previousBtn.textContent='‹';

previousBtn.style.position='absolute';

previousBtn.style.left='12px';

previousBtn.style.top='50%';

previousBtn.style.transform='translateY(-50%)';

previousBtn.style.zIndex='1001';

previousBtn.style.background='rgba(0,0,0,.35)';

previousBtn.style.color='white';

previousBtn.style.border='0';

previousBtn.style.borderRadius='50%';

previousBtn.style.width='48px';

previousBtn.style.height='48px';

previousBtn.style.fontSize='38px';

previousBtn.style.cursor='pointer';

previousBtn.addEventListener('click',showPrevious);

viewer.appendChild(previousBtn);

     

     
     
  viewer.style.display='block';

}


function showNext(){

  if(currentIndex<clientMedia.length-1){

    openViewer(clientMedia[currentIndex+1]);

  }

}


function showPrevious(){

  if(currentIndex>0){

    openViewer(clientMedia[currentIndex-1]);

  }

}
   loadEventName();
   loadClientGallery();
   



   
</script> 

  
</body>

</html>
