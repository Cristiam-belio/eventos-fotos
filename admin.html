<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Administración de eventos</title>

<style>

*{box-sizing:border-box}

body{

margin:0;

font-family:system-ui,-apple-system,Segoe UI,sans-serif;

background:#f5f2ee;

color:#2b2723;

}

.wrap{

max-width:700px;

margin:auto;

padding:25px 16px;

}

.card{

background:#fff;

border-radius:20px;

padding:24px;

margin-bottom:18px;

box-shadow:0 5px 24px #0000000b;

}

h1,h2{

font-family:Georgia,serif;

font-weight:500;

}

h1{

margin-top:0;

}

label{

display:block;

font-weight:600;

margin-top:18px;

margin-bottom:7px;

}

input,select{

width:100%;

padding:13px;

border:1px solid #ddd;

border-radius:10px;

font-size:16px;

background:#fff;

}

input[type=color]{

height:50px;

padding:4px;

}

button{

width:100%;

margin-top:22px;

padding:15px;

border:0;

border-radius:12px;

background:#2b2723;

color:#fff;

font-size:16px;

font-weight:600;

cursor:pointer;

}

button:disabled{

opacity:.6;

}

.event{

border:1px solid #e5dfd8;

border-radius:14px;

padding:15px;

margin-top:12px;

}

.event-name{

font-weight:700;

font-size:17px;

}

.event-date{

font-size:14px;

color:#756d65;

margin-top:4px;

}

.event-slug{

font-size:12px;

color:#9a9188;

margin-top:6px;

word-break:break-all;

}

.event button{

margin-top:12px;

padding:10px;

font-size:14px;

}

.status{

margin-top:15px;

font-size:14px;

}

.success{

color:#3b6b45;

}

.error{

color:#a33;

}

hr{

border:0;

border-top:1px solid #eee;

margin:25px 0;

}

</style>

</head>

<body>
<div id="loginScreen" style="max-width:420px;margin:80px auto;padding:24px;">

  <h1>Administración</h1>

  <p>Inicia sesión para continuar</p>

  <input

    id="loginEmail"

    type="email"

    placeholder="Correo electrónico"

    style="width:100%;padding:12px;margin:8px 0;"

  >

  <input

    id="loginPassword"

    type="password"

    placeholder="Contraseña"

    style="width:100%;padding:12px;margin:8px 0;"

  >

  <button

    id="loginButton"

    style="width:100%;padding:14px;margin-top:10px;"

  >

    Iniciar sesión

  </button>

  <p id="loginMessage"></p>

</div>

  
<main class="wrap" id="adminPanel" style="display:none;">
<button id="logoutButton" type="button" style="float:right;padding:8px 14px;cursor:pointer;">

  Cerrar sesión

</button>
  

<div class="card">

<h1>Administración de eventos</h1>

<p>Crea y administra los eventos de tu plataforma.</p>

<h2>Crear nuevo evento</h2>

<label>Nombre del evento</label>

<input

id="name"

type="text"

placeholder="Ej. XV Años de Valeria">

<label>Tipo de evento</label>

<select id="event-type">

<option value="XV Años">XV Años</option>

<option value="Boda">Boda</option>

<option value="Cumpleaños">Cumpleaños</option>

<option value="Bautizo">Bautizo</option>

<option value="Primera Comunión">Primera Comunión</option>

<option value="Graduación">Graduación</option>

<option value="Evento empresarial">Evento empresarial</option>

<option value="Otro">Otro</option>

</select>

<label>Fecha del evento</label>

<input id="date" type="date">

<label>Mensaje de bienvenida</label>

<input

id="welcome"

type="text"

placeholder="Una noche para recordar">

<label>Color principal</label>

<input id="primary" type="color" value="#2b2723">

<label>Color secundario</label>

<input id="secondary" type="color" value="#D4AF37">

<button id="create">

Crear evento

</button>

<div id="create-status" class="status"></div>

</div>

<div class="card">

<h2>Eventos existentes</h2>

<div id="events-list">

Cargando eventos...

</div>

<div id="edit-status" class="status"></div>

</div>

<div class="card" id="edit-card" style="display:none">

<h2>Editar evento</h2>

<label>Nombre del evento</label>

<input id="edit-name" type="text">

<label>Tipo de evento</label>

<select id="edit-type">

<option value="XV Años">XV Años</option>

<option value="Boda">Boda</option>

<option value="Cumpleaños">Cumpleaños</option>

<option value="Bautizo">Bautizo</option>

<option value="Primera Comunión">Primera Comunión</option>

<option value="Graduación">Graduación</option>

<option value="Evento empresarial">Evento empresarial</option>

<option value="Otro">Otro</option>

</select>

<label>Fecha del evento</label>

<input id="edit-date" type="date">

<label>Mensaje de bienvenida</label>

<input id="edit-welcome" type="text">

<label>Color principal</label>

<input id="edit-primary" type="color">

<label>Color secundario</label>

<input id="edit-secondary" type="color">

<button id="save-edit">

Guardar cambios

</button>

<div id="selected-id"></div>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL=

'https://qzsukbfxqdyhpbzlzlwd.supabase.co';

const SUPABASE_KEY=

'sb_publishable_CLf1AiL7oKwqFQsG7oYGSg_F8qNl-nk';

const {createClient}=window.supabase;

const db=createClient(

SUPABASE_URL,

SUPABASE_KEY

);

const loginScreen=document.getElementById('loginScreen');

const adminPanel=document.getElementById('adminPanel');

const loginButton=document.getElementById('loginButton');

const loginMessage=document.getElementById('loginMessage');

async function checkSession(){

  const {data:{session}}=await db.auth.getSession();

  if(session){

    loginScreen.style.display='none';

    adminPanel.style.display='block';

  }

}

checkSession();
  document.getElementById('logoutButton').addEventListener('click',async()=>{

  await db.auth.signOut();

  adminPanel.style.display='none';

  loginScreen.style.display='block';

  document.getElementById('loginPassword').value='';

  loginMessage.textContent='';

});
  

loginButton.addEventListener('click',async()=>{

  const email=document.getElementById('loginEmail').value.trim();

  const password=document.getElementById('loginPassword').value;

  loginMessage.textContent='Iniciando sesión...';

  const {data,error}=await db.auth.signInWithPassword({

    email,

    password

  });

  if(error){

    loginMessage.textContent='Correo o contraseña incorrectos.';

    return;

  }

  loginScreen.style.display='none';

  adminPanel.style.display='block';

  loginMessage.textContent='';

});
  

const nameInput=

document.getElementById('name');

const typeInput=

document.getElementById('event-type');

const dateInput=

document.getElementById('date');

const welcomeInput=

document.getElementById('welcome');

const primaryInput=

document.getElementById('primary');

const secondaryInput=

document.getElementById('secondary');

const createButton=

document.getElementById('create');

const createStatus=

document.getElementById('create-status');

const eventsList=

document.getElementById('events-list');

let selectedEventId=null;

function createSlug(text){

return text

.normalize('NFD')

.replace(/[\u0300-\u036f]/g,'')

.toLowerCase()

.replace(/[^a-z0-9]+/g,'-')

.replace(/^-+|-+$/g,'');

}

async function loadEvents(){

const {data,error}=await db

.from('events')

.select('*')

.order('event_date',{ascending:true});

if(error){

eventsList.textContent=

'No se pudieron cargar los eventos.';

console.error(error);

return;

}

if(!data.length){

eventsList.textContent=

'Aún no hay eventos.';

return;

}

eventsList.innerHTML='';

for(const event of data){

const box=document.createElement('div');

box.className='event';

box.innerHTML=`

<div class="event-name">

${event.name}

</div>

<div class="event-date">

${new Date(event.event_date+'T00:00:00')

.toLocaleDateString('es-MX',{

day:'numeric',

month:'long',

year:'numeric'

})}

</div>

<div class="event-slug">

${event.slug}

</div>

<button>

Editar evento

</button>

`;

box.querySelector('button')

.addEventListener('click',()=>{

editEvent(event);

});

eventsList.appendChild(box);

}

}

function editEvent(event){

selectedEventId=event.id;

document.getElementById('edit-card')

.style.display='block';

document.getElementById('edit-name')

.value=event.name || '';

document.getElementById('edit-type')

.value=event.event_type || 'Otro';

document.getElementById('edit-date')

.value=event.event_date || '';

document.getElementById('edit-welcome')

.value=event.welcome_message || '';

document.getElementById('edit-primary')

.value=event.primary_color || '#2b2723';

document.getElementById('edit-secondary')

.value=event.secondary_color || '#D4AF37';

document.getElementById('selected-id')

.textContent=

'Evento seleccionado: '+event.slug;

window.scrollTo({

top:document.getElementById('edit-card').offsetTop,

behavior:'smooth'

});

}

createButton.addEventListener(

'click',

async()=>{

const name=nameInput.value.trim();

const date=dateInput.value;

if(!name || !date){

createStatus.textContent=

'Escribe el nombre y la fecha del evento.';

createStatus.className='status error';

return;

}

createButton.disabled=true;

createButton.textContent='Creando...';

const baseSlug=

createSlug(name)+'-'+date;

let slug=baseSlug;

let counter=2;

while(true){

const {data}=await db

.from('events')

.select('id')

.eq('slug',slug)

.maybeSingle();

if(!data)break;

slug=baseSlug+'-'+counter;

counter++;

}

const {error}=await db

.from('events')

.insert({

name:name,

event_date:date,

slug:slug,

event_type:typeInput.value,

primary_color:primaryInput.value,

secondary_color:secondaryInput.value,

welcome_message:

welcomeInput.value.trim() ||

'Una noche para recordar'

});

if(error){

createStatus.textContent=

'No se pudo crear el evento.';

createStatus.className='status error';

console.error(error);

}else{

createStatus.textContent=

'Evento creado correctamente.';

createStatus.className='status success';

nameInput.value='';

dateInput.value='';

welcomeInput.value='';

primaryInput.value='#2b2723';

secondaryInput.value='#D4AF37';

await loadEvents();

}

createButton.disabled=false;

createButton.textContent='Crear evento';

});

document.getElementById('save-edit')

.addEventListener('click',async()=>{

if(!selectedEventId)return;

const {error}=await db

.from('events')

.update({

name:document.getElementById('edit-name').value.trim(),

event_type:document.getElementById('edit-type').value,

event_date:document.getElementById('edit-date').value,

welcome_message:

document.getElementById('edit-welcome').value.trim(),

primary_color:

document.getElementById('edit-primary').value,

secondary_color:

document.getElementById('edit-secondary').value

})

.eq('id',selectedEventId);

const status=

document.getElementById('edit-status');

if(error){

status.textContent=

'No se pudieron guardar los cambios.';

status.className='status error';

console.error(error);

}else{

status.textContent=

'Cambios guardados correctamente.';

status.className='status success';

await loadEvents();

}

});

loadEvents();

</script>

</body>

</html>
