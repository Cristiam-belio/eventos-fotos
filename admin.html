function createSlug(text){

return text

.normalize('NFD')

.replace(/[\u0300-\u036f]/g,'')

.toLowerCase()

.replace(/[^a-z0-9]+/g,'-')

.replace(/^-+|-+$/g,'');

}

const generateCard = async (mode = 'download')=>{

  await document.fonts.load('100px "Great Vibes"');

  const canvas = document.createElement('canvas');

  canvas.width = 1200;

  canvas.height = 1600;

  const ctx = canvas.getContext('2d');

  const primary = event.primary_color || '#2b2723';
  const secondary = event.secondary_color || '#D4AF37';
const readableSecondary = (color)=>{

  const hex = color.replace('#','');

  const r = parseInt(hex.substring(0,2),16);

  const g = parseInt(hex.substring(2,4),16);

  const b = parseInt(hex.substring(4,6),16);

  const brightness = (r * 299 + g * 587 + b * 114) / 1000;

  if(brightness > 210){

    const max = Math.max(r,g,b);

    const min = Math.min(r,g,b);

    // Si el color tiene muy poca saturación, lo oscurecemos normalmente

    if(max - min < 25){

      return `rgb(${Math.round(r*0.65)}, ${Math.round(g*0.65)}, ${Math.round(b*0.65)})`;

    }

    // Si tiene color, aumentamos su saturación antes de oscurecerlo

    const avg = (r + g + b) / 3;

    const saturationBoost = 1.8;

    const newR = Math.max(0,Math.min(255,

      avg + (r-avg)*saturationBoost

    ));

    const newG = Math.max(0,Math.min(255,

      avg + (g-avg)*saturationBoost

    ));

    const newB = Math.max(0,Math.min(255,

      avg + (b-avg)*saturationBoost

    ));

    return `rgb(${Math.round(newR*0.78)}, ${Math.round(newG*0.78)}, ${Math.round(newB*0.78)})`;

  }

  return color;

};
const secondaryText = readableSecondary(secondary);
  

  // Fondo

  ctx.fillStyle = '#FAF8F5';

  ctx.fillRect(0,0,1200,1600);

  // Marcos

  ctx.strokeStyle = primary;

  ctx.lineWidth = 9;

  ctx.strokeRect(45,45,1110,1510);

  ctx.strokeStyle = secondary;

  ctx.lineWidth = 3;

  ctx.strokeRect(70,70,1060,1460);

  ctx.textAlign = 'center';

  // Tipo de evento

  ctx.fillStyle = secondaryText;

  ctx.font = 'bold 48px Georgia';

  ctx.fillText(

    (event.event_type || 'Evento').toUpperCase(),

    600,

    145

  );

// Nombres de los festejados

ctx.fillStyle = primary;

const displayName =

  event.celebrant_names || event.name;

// Tamaño automático para aprovechar el ancho disponible

let nameFontSize = 100;

const maxNameWidth = 900;

do {

  ctx.font = `${nameFontSize}px "Great Vibes", cursive`;

  nameFontSize -= 2;

} while (

  ctx.measureText(displayName).width > maxNameWidth &&

  nameFontSize > 50

);

ctx.fillText(displayName,600,245);

  // Detalle decorativo

  ctx.strokeStyle = secondary;

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(420,285);

  ctx.lineTo(780,285);

  ctx.stroke();

  // Fecha

  const formattedDate =

    new Date(event.event_date+'T00:00:00')

      .toLocaleDateString('es-MX',{

        day:'numeric',

        month:'long',

        year:'numeric'

      });

  ctx.fillStyle = '#555555';

  ctx.font = '30px Arial';

  ctx.fillText(formattedDate,600,345);

  // Invitación

  ctx.fillStyle = secondaryText;

  ctx.font = 'bold 43px Arial';

  ctx.fillText(

    'Comparte tus mejores momentos',

    600,

    440

  );

  ctx.fillStyle = '#666666';

  ctx.font = '28px Arial';

  ctx.fillText(

    'Escanea para subir tus fotos y videos',

    600,

    495

  );

  // Área del QR

  ctx.fillStyle = '#ffffff';

  ctx.fillRect(260,555,680,680);

  ctx.strokeStyle = secondary;

  ctx.lineWidth = 5;

  ctx.strokeRect(260,555,680,680);

  const qrCanvas = qrCode.querySelector('canvas');

  const qrImage = qrCode.querySelector('img');

  const finishCard = (source)=>{

    // QR con margen blanco para facilitar lectura

    ctx.drawImage(source,320,615,560,560);

    ctx.fillStyle = secondaryText;

    ctx.font = 'bold 31px Arial';

    ctx.fillText(

      '¡Queremos ver el evento desde tus ojos!',

      600,

      1320

    );

    ctx.fillStyle = '#666666';

    ctx.font = '26px Arial';

    ctx.fillText(

      'Escanea  •  Comparte  •  Disfruta',

      600,

      1370

    );

    // Separador inferior

    ctx.strokeStyle = secondary;

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(390,1430);

    ctx.lineTo(810,1430);

    ctx.stroke();

    // Espacio preparado para nuestra futura marca

    ctx.fillStyle = '#888888';

    ctx.font = '22px Arial';

    ctx.fillText(

      'Fotos y videos compartidos del evento',

      600,

      1490

    );

    // Descargar

    const imageUrl = canvas.toDataURL('image/png');

if(mode === 'preview'){

  const overlay = document.createElement('div');

  overlay.style.inset = '0';

  const previewImage = document.createElement('img');

}

  };

  if(qrCanvas){

const coverX = document.getElementById('edit-cover-x');

const coverY = document.getElementById('edit-cover-y');

const coverZoom = document.getElementById('edit-cover-zoom');

const coverPreviewImg = document.getElementById('edit-cover-preview-img');

const resetCover = document.getElementById('reset-cover-position');

function updateCoverPreview(){

  const x = Number(coverX.value);

const y = Number(coverY.value);

const zoom = Number(coverZoom.value);

coverPreviewImg.style.objectPosition =

  `${x}% ${y}%`;

coverPreviewImg.style.transformOrigin =

  `${x}% ${y}%`;

coverPreviewImg.style.transform =

  `scale(${zoom})`;

}

coverX.addEventListener('input',updateCoverPreview);

coverY.addEventListener('input',updateCoverPreview);

coverZoom.addEventListener('input',updateCoverPreview);

resetCover.addEventListener('click',()=>{

  coverX.value=50;

  coverY.value=50;

  coverZoom.value=1;

  updateCoverPreview();

});

const editCoverInput = document.getElementById('edit-cover');

const coverPreview = document.getElementById('edit-cover-preview');

editCoverInput.addEventListener('change',()=>{

  const file = editCoverInput.files[0];

  if(!file) return;

  const previewUrl = URL.createObjectURL(file);

  coverPreviewImg.src = previewUrl;

  coverPreview.style.display = 'block';

  coverX.value = 50;

  coverY.value = 50;

  coverZoom.value = 1;

  updateCoverPreview();

});
  
createButton.addEventListener(

'click',

async()=>{

while(true){

const {data}=await db

if(!data)break;

slug=baseSlug+'-'+counter;

counter++;

celebrant_names:celebrantNames,

event_date:date,

slug:slug,

event_type:typeInput.value,

primary_color:primaryInput.value,

secondary_color:secondaryInput.value,

welcome_message:

welcomeInput.value.trim() ||

'Una noche para recordar'

});

if(error){

createStatus.textContent=

'No se pudo crear el evento.';

createStatus.className='status error';

console.error(error);

}else{

const clientPassword = String(Math.floor(100000 + Math.random() * 900000));

  const passwordResponse = await fetch('/api/client-password', {

  method: 'POST',

  headers: {'Content-Type':'application/json'},

  body: JSON.stringify({

    eventId: selectedEventId,

    password: clientPassword

  })

});

  if (!passwordResponse.ok) {

  throw new Error('No se pudo guardar la contraseña del cliente');

}
  

createStatus.textContent=

'Evento creado correctamente.';

createStatus.className='status success';

nameInput.value='';

dateInput.value='';

welcomeInput.value='';

primaryInput.value='#2b2723';

secondaryInput.value='#D4AF37';

await loadEvents();

}

createButton.disabled=false;

createButton.textContent='Crear evento';

});

document.getElementById('save-edit')

.addEventListener('click',async()=>{

if(!selectedEventId)return;


const coverFile =

  document.getElementById('edit-cover').files[0];

let coverPath = null;

if(coverFile){

  const extension =

    coverFile.name.split('.').pop();

  coverPath =

    `covers/${selectedEventId}-${Date.now()}.${extension}`;

  const {error:uploadError}=await db

    .storage

    .from('event-media')

    .upload(coverPath,coverFile);

  if(uploadError){

    console.error(uploadError);

    alert('No se pudo subir la foto de portada.');

    return;

  }

}

const {error}=await db

.from('events')

.update({

name:document.getElementById('edit-name').value.trim(),

celebrant_names:document.getElementById('edit-celebrant-names').value.trim(),
event_type:document.getElementById('edit-type').value,

event_date:document.getElementById('edit-date').value,

welcome_message:

document.getElementById('edit-welcome').value.trim(),

primary_color:

document.getElementById('edit-primary').value,

secondary_color:

document.getElementById('edit-secondary').value,

cover_image: coverPath || selectedEventCover,

cover_position_x: Number(document.getElementById('edit-cover-x').value),

cover_position_y: Number(document.getElementById('edit-cover-y').value),

cover_zoom: Number(document.getElementById('edit-cover-zoom').value)

})

.eq('id',selectedEventId);

const status=

document.getElementById('edit-status');

if(error){

status.textContent=

'No se pudieron guardar los cambios.';

status.className='status error';

console.error(error);

}else{

status.textContent=

'Cambios guardados correctamente.';

status.className='status success';

await loadEvents();

}

});

loadEvents();

</script>

</body>

</html>
